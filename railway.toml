# Railway configuration for backend deployment
# For monorepo setup: Create separate Railway services for backend and frontend
# Backend service should have root directory set to: /backend

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[deploy.env]
# Environment variables can be set in Railway dashboard
